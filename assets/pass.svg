<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
  <rect width="1200" height="420" rx="28" fill="#07080d"/>
  <text x="56" y="64" fill="#9aa3b5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing="3">ONE PASS</text>
  <text x="56" y="108" fill="#f4f7fb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="650">Open it. Close it. The local copy molts.</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="56" y="160" width="320" height="200" rx="22" fill="#10131b" stroke="#1e2636"/>
    <circle cx="96" cy="204" r="8" fill="#3ee0c5"/>
    <text x="116" y="210" fill="#3ee0c5" font-size="14" letter-spacing="2">01  OPEN</text>
    <text x="84" y="268" fill="#f4f7fb" font-size="28">Download</text>
    <text x="84" y="304" fill="#9aa3b5" font-size="16">macOS fetches the file</text>
    <text x="84" y="328" fill="#9aa3b5" font-size="16">only because you opened it</text>

    <rect x="440" y="160" width="320" height="200" rx="22" fill="#10131b" stroke="#1e2636"/>
    <circle cx="480" cy="204" r="8" fill="#7c6bff"/>
    <text x="500" y="210" fill="#7c6bff" font-size="14" letter-spacing="2">02  CLOSE</text>
    <text x="468" y="268" fill="#f4f7fb" font-size="28">You are done</text>
    <text x="468" y="304" fill="#9aa3b5" font-size="16">the cloud copy never moved</text>
    <text x="468" y="328" fill="#9aa3b5" font-size="16">the Mac copy is leftover</text>

    <rect x="824" y="160" width="320" height="200" rx="22" fill="#10131b" stroke="#1e2636"/>
    <circle cx="864" cy="204" r="8" fill="#3ee0c5"/>
    <text x="884" y="210" fill="#3ee0c5" font-size="14" letter-spacing="2">03  MOLT</text>
    <text x="852" y="268" fill="#f4f7fb" font-size="28">Local bytes go</text>
    <text x="852" y="304" fill="#9aa3b5" font-size="16">about 3 minutes later</text>
    <text x="852" y="328" fill="#9aa3b5" font-size="16">iCloud still has the file</text>
  </g>
</svg>
